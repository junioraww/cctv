server {
    listen 80;
    server_name _;

    # Запрещаем Nginx делать абсолютные редиректы с 127.0.0.1, редиректы должны быть относительными (/stream/...)
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    # Frontend Single Page Application
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static avatar uploads
    location /avatars/ {
        alias /var/www/html/avatars/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # CCTV Backend API (поддержка прямого /api/ и прокси через VPN /cctv-api/)
    location /api/ {
        proxy_pass http://api:3033/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /cctv-api/ {
        proxy_pass http://api:3033/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MediaMTX HLS Live Streams
    location /stream/ {
        proxy_pass http://mediamtx:8888/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Переписываем любые редиректы и куки MediaMTX обратно в относительный /stream/
        proxy_redirect ~^https?://[^/]+/(.*)$ /stream/$1;
        proxy_redirect ~^/(.*)$ /stream/$1;
        proxy_cookie_path / /stream/;

        # CORS заголовки для воспроизведения в браузере
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, HEAD" always;
        add_header Access-Control-Allow-Headers "*" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, HEAD" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        # Disable buffering and caching for low-latency HLS
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }

    # Прямой прокси для запросов к потокам /<groupId>/<camId>/... (если клиент или MediaMTX обращаются без /stream/)
    location ~ ^/\d+/\d+/ {
        proxy_pass http://mediamtx:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect ~^https?://[^/]+/(.*)$ /$1;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, HEAD" always;
        add_header Access-Control-Allow-Headers "*" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, HEAD" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
